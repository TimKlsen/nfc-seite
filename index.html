<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a0a16">
<title>Unsere Geschichte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { wine: { 950:'#2a060f', 900:'#3a0a16', 800:'#4f0e1f', 700:'#6b1228', 600:'#861a33' }, rose:{ cream:'#f6e3dc' }, gold:'#d2ab82' },
    fontFamily: { serif:['"Cormorant Garamond"','Georgia','serif'], sans:['Jost','system-ui','sans-serif'] }
  } }
}
</script>
<style>
  html, body { height:100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #6b1228 0%, #4f0e1f 45%, #2a060f 100%) fixed;
    color:#f6e3dc; -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .seal { transition: transform .5s cubic-bezier(.5,-0.4,.3,1.4), opacity .6s; }
  .seal.open { transform: scale(1.6) rotate(18deg); opacity:0; pointer-events:none; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(210,171,130,.35);} 50%{ box-shadow:0 0 0 22px rgba(210,171,130,0);} }
  .reveal { opacity:0; transform: translateY(10px); transition: opacity .8s, transform .8s; }
  .reveal.show { opacity:1; transform:none; }
  .float-heart { position:fixed; pointer-events:none; font-size:22px; animation: up 1.8s ease-out forwards; z-index:50; }
  @keyframes up { to { transform: translateY(-160px) scale(1.4); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .float-heart { animation:none; } .seal, .reveal { transition:none; } }
</style>
</head>
<body class="font-sans min-h-full">

<!-- ====== SIEGEL (erster Moment) ====== -->
<div id="intro" class="fixed inset-0 z-40 flex flex-col items-center justify-center px-8 text-center bg-wine-950">
  <p class="font-serif italic text-2xl text-gold mb-10">Für <span id="introName"></span></p>
  <button id="seal" class="seal pulse w-44 h-44 rounded-full flex items-center justify-center bg-gradient-to-br from-wine-600 to-wine-900 border border-gold/50 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold" aria-label="Siegel brechen und öffnen">
    <svg viewBox="0 0 24 24" class="w-20 h-20" fill="#d2ab82" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4.2 2.4h3.6C14.6 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg>
  </button>
  <p class="mt-10 text-sm tracking-wide text-rose-cream/70">Tippe auf das Siegel</p>
</div>

<!-- ====== INHALT ====== -->
<main id="content" class="max-w-md mx-auto px-6 pt-16 pb-20 text-center">

  <h1 class="reveal font-serif italic text-5xl leading-tight text-rose-cream">Unsere<br>Geschichte</h1>
  <p class="reveal mt-4 font-serif text-lg text-gold" id="subtitle"></p>

  <!-- Zähler -->
  <section class="reveal mt-14">
    <p class="text-sm text-rose-cream/70">Wir sind zusammen seit</p>
    <p id="days" class="font-serif text-7xl text-gold mt-2 tabular-nums">0</p>
    <p class="text-rose-cream/80">Tagen, und ich zähle gern weiter.</p>
    <p id="detail" class="mt-3 text-xs text-rose-cream/50"></p>
  </section>

  <div class="reveal mx-auto my-12 h-px w-24 bg-gold/40"></div>

  <!-- Brief: Zeile für Zeile -->
  <section class="reveal">
    <div id="letter" class="min-h-[11rem] flex flex-col items-center justify-center gap-4 font-serif text-2xl italic leading-snug text-rose-cream"></div>
    <button id="next" class="mt-8 px-7 py-3 rounded-full border border-gold/60 text-gold text-sm active:bg-gold/15 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold">Weiterlesen</button>
  </section>

  <div class="reveal mx-auto my-12 h-px w-24 bg-gold/40"></div>

  <!-- Hinweis fürs Buch -->
  <section class="reveal">
    <p class="font-serif text-xl text-rose-cream">Und jetzt blätter um.</p>
    <p class="mt-3 text-sm leading-relaxed text-rose-cream/70">Hinter jedem Foto wartet eine Erinnerung.<br>Halte dein Handy einfach an den kleinen Chip auf der Seite.</p>
    <button id="heart" class="mt-8 text-4xl active:scale-90 transition-transform" aria-label="Herz schicken">❤️</button>
    <p class="mt-1 text-xs text-rose-cream/40">Tipp mich an</p>
  </section>
</main>

<script>
/* ====== HIER ANPASSEN ====== */
const CONFIG = {
  name: "Schatz",                    // Name deiner Freundin
  subtitle: "Alles Gute zum Geburtstag",
  since: "2022-06-14",               // Datum, ab dem ihr zusammen seid (JJJJ-MM-TT)
  letter: [
    "Hier ist ein Buch, das nicht stillsteht.",
    "Jede Seite ist ein Moment, den wir zusammen erlebt haben.",
    "Danke, dass du jeden davon besser machst.",
    "Ich liebe dich."
  ]
};
/* =========================== */

const $ = id => document.getElementById(id);
$('introName').textContent = CONFIG.name;
$('subtitle').textContent = CONFIG.subtitle;

// Tage zusammen (und Detail in Jahren/Monaten)
function counter() {
  const start = new Date(CONFIG.since + "T00:00:00"), now = new Date();
  const days = Math.max(0, Math.floor((now - start) / 864e5));
  let y = now.getFullYear() - start.getFullYear(), m = now.getMonth() - start.getMonth();
  if (now.getDate() < start.getDate()) m--;
  if (m < 0) { y--; m += 12; }
  const target = days, t0 = performance.now(), dur = 2200;
  (function tick(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    $('days').textContent = Math.round(target * e).toLocaleString('de-DE');
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
  $('detail').textContent = `das sind ${y} Jahre und ${m} Monate`;
}

// Siegel öffnen
$('seal').addEventListener('click', () => {
  $('seal').classList.add('open');
  if (navigator.vibrate) navigator.vibrate(40);
  setTimeout(() => { $('intro').style.transition = 'opacity .8s'; $('intro').style.opacity = 0; }, 350);
  setTimeout(() => $('intro').remove(), 1200);
  document.querySelectorAll('.reveal').forEach((el, i) => setTimeout(() => el.classList.add('show'), 700 + i * 350));
  setTimeout(counter, 1400);
  showLine();
});

// Brief: eine Zeile pro Tipp
let li = 0;
function showLine() {
  const p = document.createElement('p');
  p.className = 'reveal'; p.textContent = CONFIG.letter[li];
  $('letter').appendChild(p);
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('show')));
  li++;
  if (li >= CONFIG.letter.length) $('next').style.display = 'none';
}
$('next').addEventListener('click', () => { if (li < CONFIG.letter.length) showLine(); });

// Herzen aufsteigen lassen
$('heart').addEventListener('click', e => {
  if (navigator.vibrate) navigator.vibrate(20);
  const r = e.currentTarget.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const h = document.createElement('span');
    h.className = 'float-heart'; h.textContent = ['❤️','🤍','💕'][i % 3];
    h.style.left = (r.left + r.width / 2 + (Math.random() * 90 - 45)) + 'px';
    h.style.top = r.top + 'px';
    h.style.animationDelay = (i * 80) + 'ms';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2200);
  }
});
</script>
</body>
</html>
